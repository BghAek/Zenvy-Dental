name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    # Throwaway Postgres for the DB-backed suites (tenant isolation, auth flow).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: zenvy_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # BullMQ, for the E2E run only: the API process is also the worker, and
      # an inbound WhatsApp message reaches the inbox through this queue.
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci@localhost:5432/zenvy_ci
      BETTER_AUTH_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Build (includes per-workspace typecheck)
        run: pnpm build
      - name: Migrate test database
        run: pnpm --filter @zenvy/api prisma migrate deploy
      - name: Test
        run: pnpm test
      # E2E last: it seeds the demo clinic, which rebuilds the database the
      # suites above just used. Playwright starts the built API and dashboard
      # itself (packages/e2e/playwright.config.ts).
      - name: Seed demo clinic
        run: pnpm --filter @zenvy/api prisma db seed
      - name: Install Playwright browser
        run: pnpm --filter @zenvy/e2e exec playwright install --with-deps chromium
      - name: E2E
        run: pnpm --filter @zenvy/e2e e2e
      - name: Upload E2E report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/e2e/playwright-report
          retention-days: 7
