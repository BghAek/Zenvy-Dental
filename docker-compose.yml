# Local stack (docs/13-local-dev.md). Production is docker-compose.prod.yml —
# same three services, TLS and subdomain vhosts on top (docs/14-deploy.md).
#
# Every port is published on 127.0.0.1 only: Docker's own iptables rules bypass
# the host firewall, so a 0.0.0.0 bind on a public machine is public whatever
# ufw says (docs/14-deploy.md §Firewall). Nothing here needs a LAN listener.
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      PORT: 3001
      REDIS_URL: redis://redis:6379
    ports:
      - '127.0.0.1:3001:3001'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3001/health | grep -q ''"status":"ok"''']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - '127.0.0.1:8080:80'
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./apps/landing/out:/srv/landing:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  redis-data:
