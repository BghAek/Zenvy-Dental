# Production vhosts on the Contabo VPS (docs/14-deploy.md, docs/01 §Infrastructure).
# Mounted read-only by docker-compose.prod.yml; the static roots are baked into
# the image by infra/nginx/Dockerfile.
#
#   zenvydental.fr → landing (Next static export)   app. → dashboard SPA
#   ops.           → owner portal SPA                api. → the NestJS API
#
# The two SPAs proxy /api on their own origin, so session cookies and Better
# Auth's links stay same-origin and the CORS allowlist stays empty (docs/04
# §Platform hardening). api. exists for what has no browser: the Meta and
# Stripe webhooks, and the uptime monitor.

# One certificate covers all five names (docs/14-deploy.md §TLS).
ssl_certificate     /etc/letsencrypt/live/zenvydental.fr/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/zenvydental.fr/privkey.pem;
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_session_cache   shared:SSL:10m;
ssl_session_timeout 1d;

# `always` so it also rides on error responses. Set here, in http context, so
# every vhost below inherits it.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

# Plain HTTP exists only to send browsers to HTTPS.
server {
  listen 80 default_server;
  server_name _;
  return 301 https://$host$request_uri;
}

# Anything else that resolves here — an IP scan, a stale DNS record — gets
# nothing. 444: close the connection without a response.
server {
  listen 443 ssl default_server;
  server_name _;
  return 444;
}

# Landing — the public marketing site.
server {
  listen 443 ssl;
  server_name zenvydental.fr;
  root /srv/landing;
  index index.html;
  error_page 404 /404.html;

  # Content-hashed by Next; `expires` alone, because add_header here would drop
  # the inherited HSTS header.
  location /_next/static/ {
    expires 1y;
  }

  # Static export writes /tarifs as tarifs.html. `=404` rather than /404.html as
  # the fallback: a try_files fallback path is served with 200, and a soft 404
  # is an SEO liability on the one app that exists to be indexed.
  location / {
    try_files $uri $uri.html $uri/ =404;
  }
}

# One canonical host for SEO.
server {
  listen 443 ssl;
  server_name www.zenvydental.fr;
  return 301 https://zenvydental.fr$request_uri;
}

# Dentist dashboard.
server {
  listen 443 ssl;
  server_name app.zenvydental.fr;
  root /srv/app;

  location /api/ {
    proxy_pass http://api:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /assets/ {
    expires 1y;
  }

  # The shell must never be cached, or a deploy ships new assets to browsers
  # still asking for the old ones.
  location = /index.html {
    expires -1;
  }

  location / {
    try_files $uri /index.html;
  }
}

# Owner portal (SUPER_ADMIN only — the guard is in the API, docs/04 §RBAC).
server {
  listen 443 ssl;
  server_name ops.zenvydental.fr;
  root /srv/ops;

  location /api/ {
    proxy_pass http://api:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /assets/ {
    expires 1y;
  }

  location = /index.html {
    expires -1;
  }

  location / {
    try_files $uri /index.html;
  }
}

# The API's own hostname: webhooks (Meta, Stripe) and the uptime monitor.
server {
  listen 443 ssl;
  server_name api.zenvydental.fr;

  location = /health {
    proxy_pass http://api:3001/health;
    proxy_set_header Host $host;
  }

  location /api/ {
    proxy_pass http://api:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Nothing else is served here — no static root, no directory listing.
  location / {
    return 404;
  }
}
